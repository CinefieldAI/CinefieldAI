name: Dependency Remediation Probe

# Temporary security-remediation workbench. It does NOT commit, deploy or
# mutate any remote service. It resolves a candidate package.json + lockfile
# from scratch on a clean GitHub runner, audits production dependencies, and
# uploads the candidate files for review. Delete this workflow after the
# candidate is either adopted or rejected.

on:
  pull_request:
    paths:
      - ".github/workflows/dependency-remediation-probe.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Prepare current-stable direct dependency updates
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          // Current stable releases as verified from the public npm registry.
          // Both stay on the existing major version; no framework-major
          // migration is mixed into this security remediation.
          p.dependencies.next = '16.3.1';
          p.devDependencies['eslint-config-next'] = '16.3.1';
          p.dependencies['@trigger.dev/sdk'] = '4.5.12';
          p.devDependencies['trigger.dev'] = '4.5.12';

          // Supabase JS 2.112+ already requires Node 22; make the repository
          // runtime contract explicit instead of relying on warning-only CI.
          p.engines = { ...(p.engines || {}), node: '>=22.0.0' };

          // Do not force transitive packages yet. First measure what the
          // maintained direct releases solve natively; any remaining advisory
          // gets a package-scoped remediation rather than a global override.
          delete p.overrides;

          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE

      - name: Resolve candidate dependency tree from scratch
        run: |
          rm -rf node_modules package-lock.json
          npm install --ignore-scripts

      - name: Verify lockfile reproducibility with real install scripts
        run: |
          rm -rf node_modules
          npm ci

      - name: Record production audit
        run: |
          npm audit --omit=dev --json > dependency-remediation-audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const a = JSON.parse(fs.readFileSync('dependency-remediation-audit.json', 'utf8'));
          console.log(JSON.stringify(a.metadata?.vulnerabilities || {}, null, 2));
          NODE

      - name: TypeScript compile
        run: npx tsc --noEmit -p tsconfig.json

      - name: Next production build
        run: npm run build

      - name: C2PA native/runtime compatibility proof
        run: npm run c2pa:verify-sample

      - name: Enforce zero production HIGH / CRITICAL findings
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const a = JSON.parse(fs.readFileSync('dependency-remediation-audit.json', 'utf8'));
          const v = a.metadata?.vulnerabilities || {};
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) {
            console.error(`candidate still has critical=${v.critical || 0} high=${v.high || 0}`);
            process.exit(1);
          }
          NODE

      - name: Upload candidate dependency files and audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-remediation-candidate-${{ github.sha }}
          path: |
            package.json
            package-lock.json
            dependency-remediation-audit.json
          retention-days: 7
