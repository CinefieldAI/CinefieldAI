name: Dependency Remediation Probe

# Temporary security-remediation workbench. It does NOT commit, deploy or
# mutate any remote service. It resolves a candidate package.json + lockfile
# on a clean GitHub runner, audits production dependencies, and uploads the
# candidate files for review. Delete this workflow after the candidate is
# either adopted or rejected.

on:
  pull_request:
    paths:
      - ".github/workflows/dependency-remediation-probe.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Prepare minimal same-line security updates
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          // Stay on the current framework/Trigger.dev minor lines. No major
          // application migration is part of this security patch.
          p.dependencies.next = '16.2.11';
          p.devDependencies['eslint-config-next'] = '16.2.11';
          p.dependencies['@trigger.dev/sdk'] = '4.5.10';
          p.devDependencies['trigger.dev'] = '4.5.10';

          // Narrow overrides for advisories currently present in the locked
          // production tree. Prefer patched versions within the same package
          // major except sharp, whose published fix starts at 0.35.0.
          p.overrides = {
            ...(p.overrides || {}),
            'engine.io@<6.6.7': '6.6.7',
            'nanoid@>=3 <3.3.18': '3.3.18',
            'postcss@<8.5.18': '8.5.18',
            'sharp@<0.35.0': '0.35.3'
          };

          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE

      - name: Resolve candidate lockfile without running install scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify lockfile reproducibility
        run: npm ci --ignore-scripts

      - name: Production audit
        run: |
          npm audit --omit=dev --json > dependency-remediation-audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const a = JSON.parse(fs.readFileSync('dependency-remediation-audit.json', 'utf8'));
          const v = a.metadata?.vulnerabilities || {};
          console.log(JSON.stringify(v, null, 2));
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) process.exit(1);
          NODE

      - name: TypeScript compile
        run: npx tsc --noEmit -p tsconfig.json

      - name: Next production build
        run: npm run build

      - name: Upload candidate dependency files and audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-remediation-candidate-${{ github.sha }}
          path: |
            package.json
            package-lock.json
            dependency-remediation-audit.json
          retention-days: 7
