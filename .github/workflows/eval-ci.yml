name: Model Eval Regression Gate (Phase 22-C)

# 22-C's own done-criterion: "Threshold aşan upgrade default route olamıyor"
# — an upgrade exceeding the regression threshold cannot become the default
# route. Two real, independent jobs:
#
#   1. new-route-evidence-gate (pull_request, automatic) — every new
#      migration file touching `model_routes` (the ONLY way a new
#      (provider, provider model) pair can ever enter the router's table —
#      audited directly against admin-route-service.ts, whose three live
#      mutations can enable/disable/reprioritize/kill-switch an EXISTING
#      route but never create a new pair) must name only pairs that already
#      have completed golden-dataset evidence. Missing evidence blocks the
#      PR. See scripts/check-new-route-eval-evidence.ts's own header for the
#      full reasoning and what this deliberately does not attempt (an
#      automatic regression comparison).
#
#   2. eval-regression-gate (workflow_dispatch, manual) — the real,
#      fail-closed candidate-vs-baseline quality comparison
#      (scripts/check-model-eval-regression.ts). Naming which pair is the
#      "baseline" for a given model is a business decision this repository
#      has no automated concept of (no `is_baseline` column, no default-
#      route-change detector) — automating it would mean guessing at a
#      decision nobody made, so it stays a deliberate, explicit action.
#
# STILL AN HONEST GAP, NARROWED RATHER THAN CLOSED: job 1 proves no
# unmeasured pair can ever become routable at all — an operator can no
# longer bypass eval by adding a route and never running a comparison. It
# does NOT automatically detect "this migration changed which route is
# DEFAULT for a model" (priority is set separately, via setRoutePriority,
# which does not touch a migration) and therefore does not automatically run
# job 2's regression comparison at that moment. That link — deciding a
# reprioritization event should trigger a specific regression check — is a
# disclosed BUSINESS_DECISION, not a fabricated automation; see
# docs/security-gates.md's Phase 22 section.
#
# Marking job 1 as a REQUIRED branch-protection check is a GitHub repository
# settings action outside this codebase — this workflow makes the check
# exist and run on every relevant PR, but an operator with repo admin access
# must still flip it to required for GitHub to actually block a merge on
# failure.

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      candidate_provider_id:
        description: "Candidate provider id (e.g. fal)"
        required: true
      candidate_provider_model_id:
        description: "Candidate provider-native model id"
        required: true
      baseline_provider_id:
        description: "Baseline provider id"
        required: true
      baseline_provider_model_id:
        description: "Baseline provider-native model id"
        required: true
      regression_threshold:
        description: "Max tolerated quality drop, [0,1] — a real business decision, no default"
        required: true

permissions:
  contents: read

jobs:
  new-route-evidence-gate:
    name: new route requires existing eval evidence
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-new-route-eval-evidence.ts reads the PR base ref's migration
          # tree via `git diff ... --diff-filter=A` — needs real history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: New-route eval-evidence gate (PR base vs HEAD)
        env:
          EVAL_GATE_BASE_REF: origin/${{ github.event.pull_request.base.ref || 'main' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run eval:check-new-route-evidence

      - name: extractRoutePairs unit tests
        run: |
          node --conditions=react-server --import tsx --test \
            scripts/check-new-route-eval-evidence.test.ts

      - name: tsc
        run: npx tsc --noEmit -p tsconfig.json

  eval-regression-gate:
    name: golden-dataset regression gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Regression gate — candidate vs baseline
        env:
          EVAL_CANDIDATE_PROVIDER_ID: ${{ inputs.candidate_provider_id }}
          EVAL_CANDIDATE_PROVIDER_MODEL_ID: ${{ inputs.candidate_provider_model_id }}
          EVAL_BASELINE_PROVIDER_ID: ${{ inputs.baseline_provider_id }}
          EVAL_BASELINE_PROVIDER_MODEL_ID: ${{ inputs.baseline_provider_model_id }}
          MODEL_EVAL_REGRESSION_THRESHOLD: ${{ inputs.regression_threshold }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run eval:check-regression

      - name: tsc
        run: npx tsc --noEmit -p tsconfig.json
