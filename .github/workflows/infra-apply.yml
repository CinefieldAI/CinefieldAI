name: Infra Apply — Production (Phase 18-C)

# The ONLY path in this repository that may run `terraform apply` against
# production. Two independent gates, both required:
#
#   1. `environment: production` — a GitHub Environment. GitHub enforces
#      required reviewers on it; this repository cannot configure that
#      from a workflow file, only from repo Settings > Environments (a
#      live, external, one-time setup step — see
#      docs/operations/INFRA_EMERGENCY_RUNBOOK.md). Until a reviewer is
#      configured there, GitHub will still let the job run unattended —
#      this workflow file is CODE_COMPLETE for the gate; the gate itself
#      being LIVE requires that external configuration.
#   2. `workflow_dispatch` only — no `push` trigger. A production apply
#      requires someone to deliberately start it, naming the exact commit,
#      never an automatic reaction to a merge.
#
# Plans, does not implicitly re-diff at apply time: `terraform apply
# tfplan.binary` applies EXACTLY what was just reviewed in this same run,
# never a second silent plan.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply-production" to confirm — this runs a real apply.'
        required: true

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.8"

jobs:
  apply:
    name: apply production
    runs-on: ubuntu-latest
    environment: production # the human-approval gate — see header
    steps:
      - name: Require explicit confirmation phrase
        if: github.event.inputs.confirm != 'apply-production'
        run: |
          echo "::error::confirm input must be exactly 'apply-production'. Refusing to proceed."
          exit 1

      - name: Require live configuration
        run: |
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ] || [ -z "${{ vars.TF_STATE_BUCKET }}" ]; then
            echo "::error::AWS_ROLE_ARN / TF_STATE_BUCKET repository variables are not set. This is not a skip — a production apply workflow that cannot reach real infrastructure must fail, not report success."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        working-directory: infra/environments/production
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_DYNAMODB_TABLE }}" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="encrypt=true"

      - name: terraform plan (this run's own — the plan apply will execute)
        working-directory: infra/environments/production
        run: terraform plan -input=false -no-color -out=tfplan.binary | tee plan-output.txt

      - name: Upload plan as an artifact (evidence, retained regardless of apply outcome)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tfplan-production-apply-${{ github.sha }}-${{ github.run_id }}
          path: infra/environments/production/plan-output.txt
          retention-days: 365

      - name: terraform apply (exactly the plan just reviewed, no re-diff)
        working-directory: infra/environments/production
        run: terraform apply -input=false -auto-approve tfplan.binary

      # Bounded, no-secret evidence: actor/commit/environment/result/when.
      # See docs/operations/INFRA_EMERGENCY_RUNBOOK.md for why this stays
      # as the durable audit trail (the GitHub Actions run itself, plus
      # this line item) rather than a new database table — the actor here
      # is a GitHub identity, not a Clerk admin session, and does not fit
      # Phase 16-E's admin-privileged-action schema.
      - name: Record apply evidence
        if: always()
        run: |
          echo "actor=${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "commit=${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "environment=production" >> "$GITHUB_STEP_SUMMARY"
          echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
