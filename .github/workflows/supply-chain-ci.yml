name: Supply Chain CI (Phase 24-A/24-B/24-C)

# Required check for every PR (`supply_chain_scan` in required-checks.ts —
# applies to human AND AI-authored PRs, since ai-pr-authority.ts resolves
# required checks through that same registry). Two jobs:
#
#   1. scan (every PR + every push to main): generates a real CycloneDX
#      SBOM and an npm production-dependency vulnerability report, scans the
#      locally-built provider-worker image with Trivy, then FAILS if CRITICAL
#      or HIGH debt grows above the reviewed baseline in
#      security/supply-chain-baseline.json. Existing debt remains visible and
#      must trend downward; it is no longer possible for a green check to hide
#      a regression merely because the scanner itself exited successfully.
#
#   2. attest (push to main only): re-generates the SBOM, issues a real
#      GitHub Artifact Attestation for it (keyless — GitHub OIDC + Sigstore
#      under the hood, no signing key stored anywhere in this repository),
#      then independently verifies that attestation with `gh attestation
#      verify` before the job can succeed. Writes bounded release metadata
#      (commit SHA, workflow run id/url, environment, SBOM digest,
#      attestation subject digest) to the step summary and as a retained
#      artifact — never a secret, a signed URL, or a credential.
#
# Honest scope: the baseline gate is COUNT-based because the original scanner
# retained only aggregate npm audit data. It prevents HIGH/CRITICAL debt from
# increasing but cannot distinguish a one-for-one advisory replacement. The
# full Trivy JSON is retained as evidence for review; a future identity-level
# baseline can tighten this without weakening today's regression gate.

on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  scan:
    name: SBOM + dependency scan + container scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - run: npm ci

      - name: Generate SBOM + dependency vulnerability report
        run: npx tsx scripts/generate-sbom.ts --out sbom-out

      - name: Build provider-worker image (local only, never pushed)
        run: docker build -f Dockerfile.provider-worker -t cinefield-provider-worker:ci .

      - name: Trivy container scan — retain machine-readable evidence
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: cinefield-provider-worker:ci
          format: json
          output: trivy-results.json
          exit-code: "0"
          severity: "CRITICAL,HIGH"

      - name: Block HIGH / CRITICAL regression above reviewed baseline
        run: npx tsx scripts/check-supply-chain-baseline.ts

      - name: Upload SBOM + audit + Trivy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-${{ github.sha }}
          path: |
            sbom-out/
            trivy-results.json
            security/supply-chain-baseline.json
          retention-days: 90

  attest:
    name: Attest release provenance (main only)
    needs: scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - run: npm ci

      - name: Regenerate SBOM (the exact artifact being attested)
        run: npx tsx scripts/generate-sbom.ts --out sbom-out

      - name: Issue GitHub Artifact Attestation (keyless — no signing key in this repository)
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: sbom-out/sbom.json

      - name: Independently verify the attestation just issued
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify sbom-out/sbom.json --owner ${{ github.repository_owner }}

      - name: Record release metadata (bounded evidence — no secrets, no signed URLs)
        run: |
          SBOM_DIGEST="sha256:$(sha256sum sbom-out/sbom.json | cut -d' ' -f1)"
          {
            echo "commit_sha=${{ github.sha }}"
            echo "workflow_run_id=${{ github.run_id }}"
            echo "workflow_run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "environment=production_candidate"
            echo "build_timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "sbom_digest=${SBOM_DIGEST}"
            echo "attestation_url=${{ steps.attest.outputs.attestation-url }}"
          } | tee release-metadata.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-metadata-${{ github.sha }}
          path: release-metadata.txt
          retention-days: 365
